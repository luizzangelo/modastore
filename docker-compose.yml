services:
  app:
    build:
      context: .
      target: runner
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  dev:
    image: node:24.11.0-alpine3.22
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm install --global pnpm@12.11.2 && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - modastore_node_modules:/app/node_modules

volumes:
  modastore_node_modules:
